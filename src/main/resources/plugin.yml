name: Beaconator
version: '${version}'
main: net.azisaba.beaconator.Beaconator
api-version: '1.21'
author: albardoo02
description: A plugin that allows players to toggle potion buffs on themselves via a GUI.
commands:
  beacon:
    aliases:
      - petbeacon
      - petb
      - pb
      - buff
permissions:
  beaconator.level.apprentice:
    description: Apprentice rank buffs
    default: op
  beaconator.level.adept:
    description: Adept rank buffs
    default: op
  beaconator.level.expert:
    description: Expert rank buffs
    default: op
  beaconator.level.master:
    description: Master rank buffs
    default: op
  beaconator.reload:
    description: Allows /beacon reload
    default: op
